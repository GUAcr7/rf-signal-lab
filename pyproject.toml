[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsig"
version = "0.1.0"
description = "Golden-reference models for the Zynq RF analysis and AI project"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
